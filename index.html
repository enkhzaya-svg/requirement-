<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хэв шинж ангилагч</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel parsing and exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f3f4f6;
            touch-action: pan-y; /* Optimize for mobile touch */
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Hide scrollbar for clean mobile view */
        ::-webkit-scrollbar {
            display: none;
        }
        .step-container {
            display: none;
        }
        .step-container.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-gray-800 h-screen w-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center z-10 flex-shrink-0">
        <h1 class="text-lg font-bold">Хэв шинж Ангилагч</h1>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow overflow-hidden p-4 flex flex-col items-center justify-center relative h-full">
        
        <!-- SCREEN 1: UPLOAD -->
        <div id="screen-upload" class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 text-center fade-in flex flex-col items-center">
            <div class="mb-4 text-blue-500">
                <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
            </div>
            <h2 class="text-xl font-semibold mb-2">Excel файл оруулах</h2>
            <p class="text-sm text-gray-500 mb-6">2 баганатай .xlsx эсвэл .csv файлаа энд оруулна уу.</p>
            
            <label class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl cursor-pointer transition-colors shadow-md text-center flex items-center justify-center">
                <span>Файл сонгох</span>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden">
            </label>
        </div>

        <!-- SCREEN 2: CLASSIFY AREA -->
        <div id="screen-classify" class="w-full max-w-md h-full hidden flex-col">
            <!-- Progress Bar -->
            <div class="mb-3 flex-shrink-0">
                <div class="flex justify-between text-sm text-gray-500 font-medium mb-1">
                    <span>Явц</span>
                    <span id="progress-text">0 / 0</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Data Card (Always visible during classification) -->
            <div class="bg-white rounded-2xl shadow-md p-4 mb-3 flex-shrink min-h-[120px] max-h-[40vh] flex flex-col border border-gray-100 overflow-hidden">
                <div class="overflow-y-auto flex-grow">
                    <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wide mb-1">Багана 1</div>
                    <div id="col1-text" class="text-base font-semibold text-gray-900 mb-3 break-words leading-tight">...</div>
                    
                    <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wide mb-1 border-t pt-3">Багана 2</div>
                    <div id="col2-text" class="text-sm text-gray-700 break-words leading-tight">...</div>
                </div>
            </div>
            
            <!-- Dynamic Actions Area -->
            <div class="flex-grow flex flex-col justify-end overflow-hidden">
                
                <!-- STEP 1: RELEVANCE CHECK -->
                <div id="step-relevance" class="step-container flex-col gap-3 w-full h-full justify-center">
                    <div class="text-center font-medium text-gray-600 mb-2">Энэ мэдээлэл хамааралтай юу?</div>
                    <button onclick="handleRelevance(true)" class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-xl shadow-sm text-lg font-bold transition-transform active:scale-95 flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Тийм, хамаарна
                    </button>
                    <button onclick="handleRelevance(false)" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-4 rounded-xl shadow-sm text-lg font-bold transition-transform active:scale-95 flex items-center justify-center gap-2 mt-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        Үгүй, хамаарахгүй (Алгасах)
                    </button>
                    <button onclick="undo()" class="w-full bg-white border border-gray-300 text-gray-600 py-3 rounded-xl font-medium mt-auto mb-1">
                        &larr; Өмнөх мөр рүү буцах
                    </button>
                </div>

                <!-- STEP 2: MAIN CATEGORY -->
                <div id="step-main" class="step-container flex-col h-full">
                    <div class="text-center font-medium text-gray-600 mb-2 flex-shrink-0">Хэв шинжийг сонгоно уу:</div>
                    <div class="grid grid-cols-2 gap-3 flex-shrink-0">
                        <button onclick="handleMainCategory('1. Хэрэгцээг таних')" class="bg-[#e6f0ff] hover:bg-[#d0e3ff] text-[#1e40af] border-2 border-[#bfdbfe] py-4 px-2 rounded-xl shadow-sm text-sm font-bold transition-transform active:scale-95 flex items-center justify-center text-center h-20">
                            1. Хэрэгцээг<br>таних
                        </button>
                        <button onclick="handleMainCategory('2. Хүлээлтийг таних')" class="bg-[#f3e8ff] hover:bg-[#e9d5ff] text-[#6b21a8] border-2 border-[#d8b4fe] py-4 px-2 rounded-xl shadow-sm text-sm font-bold transition-transform active:scale-95 flex items-center justify-center text-center h-20">
                            2. Хүлээлтийг<br>таних
                        </button>
                        <button onclick="handleMainCategory('3. Хүлээлтийг удирдах')" class="bg-[#ffedd5] hover:bg-[#fed7aa] text-[#9a3412] border-2 border-[#fdba74] py-4 px-2 rounded-xl shadow-sm text-sm font-bold transition-transform active:scale-95 flex items-center justify-center text-center h-20">
                            3. Хүлээлтийг<br>удирдах
                        </button>
                        <button onclick="handleMainCategory('4. Хэрэгцээнд нийцүүлэх')" class="bg-[#dcfce7] hover:bg-[#bbf7d0] text-[#166534] border-2 border-[#86efac] py-4 px-2 rounded-xl shadow-sm text-sm font-bold transition-transform active:scale-95 flex items-center justify-center text-center h-20">
                            4. Хэрэгцээнд<br>нийцүүлэх
                        </button>
                    </div>
                    <button onclick="goBackToStep('relevance')" class="w-full bg-white border border-gray-300 text-gray-600 py-3 rounded-xl font-medium mt-auto mb-1">
                        &larr; Буцах
                    </button>
                </div>

                <!-- STEP 3: SUB CATEGORY -->
                <div id="step-sub" class="step-container flex-col h-full overflow-hidden">
                    <div id="sub-title-display" class="text-center font-bold text-blue-700 mb-2 flex-shrink-0 text-sm">Дэд ангилал</div>
                    
                    <div id="dynamic-sub-buttons" class="flex flex-col gap-2 overflow-y-auto flex-grow pb-2">
                        <!-- Buttons injected via JS -->
                    </div>
                    
                    <button onclick="goBackToStep('main')" class="w-full bg-white border border-gray-300 text-gray-600 py-3 rounded-xl font-medium mt-2 flex-shrink-0 mb-1">
                        &larr; Буцах
                    </button>
                </div>

            </div>
        </div>

        <!-- SCREEN 3: RESULT -->
        <div id="screen-result" class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 text-center hidden fade-in flex-col items-center">
            <div class="mb-4 text-green-500">
                <svg class="w-20 h-20 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">Амжилттай!</h2>
            <p class="text-gray-600 mb-8">Бүх мэдээллийг ангилж дууслаа. Одоо шинэ файлаа татаж авна уу.</p>
            
            <button onclick="downloadExcel()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-transform active:scale-95 mb-4 text-lg">
                Файл татах (.xlsx)
            </button>
            
            <button onclick="resetApp()" class="text-blue-600 font-medium underline">
                Дахин шинэ файл оруулах
            </button>
        </div>

    </main>

    <script>
        // State variables
        let excelData = []; 
        let resultData = []; 
        let currentIndex = 0;
        let originalFileName = "classified_data";
        
        let currentItemState = {
            isRelevant: "",
            mainCategory: "",
            subCategory: ""
        };

        // Дэлгэрэнгүй дэд ангиллын мэдээлэл (Таны оруулж өгсөн дата)
        const subCategoriesData = {
            '1. Хэрэгцээг таних': [
                { title: 'Мэдээлэл цуглуулах', desc: 'Үр дүнгийн хангагдсан байвал зохих түвшний талаарх хэрэгцээт дата, мэдээллийг бүрдүүлэх.' },
                { title: 'Урьдчилан таамаглах', desc: 'Бүтээгдэхүүн үйлчилгээг худалдан авснаар бий болох үр дүнг урьдчилан харах.' },
                { title: 'Тооцоолох', desc: 'Хүлээгдэж буй үр дүнгийн зохих түвшинг бодитоор тооцоолж, хэмжигдэхүйц байдлаар үнэлэх.' }
            ],
            '2. Хүлээлтийг таних': [
                { title: 'Мэдээлэл цуглуулах', desc: 'Хэрэглэгчийн сэтгэхүй, хандлагад үүсэх төсөөллийн талаарх мэдээллийг судлах.' },
                { title: 'Урьдчилан таамаглах', desc: 'Бүтээгдэхүүн үйлчилгээ худалдан авснаар хэрэглэгчийн сэтгэхүйд үүсэх сэтгэлгээний загварыг урьдчилан таах.' },
                { title: 'Тооцоолох', desc: 'Тухайн үүсэх сэтгэлгээний загвар болон хүлээлтийн хэмжээ, нөлөөллийг тооцоолох.' }
            ],
            '3. Хүлээлтийг удирдах': [
                { title: 'Үр дүнтэй нийцүүлэх', desc: 'Хэрэглэгчийн хүлээлтийг бүтээгдэхүүн үйлчилгээгээр бий болох бодит үр дүнтэй харьцуулж, уялдуулах.' },
                { title: 'Мэдээллийг нийцүүлэх', desc: 'Зөрүүтэй хүлээлт үүсгэхгүй байхын тулд үр дүн болон хүлээлтийг нийцүүлэх тохиромжтой мэдээллийг бэлтгэх.' },
                { title: 'Мэдээллээр удирдах', desc: 'Бэлтгэсэн нийцүүлэх мэдээллээрээ дамжуулан хэрэглэгчийн хүлээлтийг зөв чиглүүлж удирдах.' }
            ],
            '4. Хэрэгцээнд нийцүүлэх': [
                { title: 'Үр дүн бий болгох', desc: 'Бүтээгдэхүүн, үйлчилгээгээр дамжуулан тодорхой бодит үр дүнг гаргах.' },
                { title: 'Зохих түвшинд хүргэх', desc: 'Тэрхүү бий болгосон үр дүнгээ "хангагдсан байвал зохих түвшинд" хүртэл нь ахиулах буюу шаардлагад нийцэх хэмжээнд хүргэх.' },
                { title: 'Нийцүүлэх үйл ажиллагаа', desc: 'Зохих түвшинд хүрсэн үр дүнгээрээ хэрэглэгчийн хүлээлтийг бүрэн хангаж, бодит үйл ажиллагаагаар баталгаажуулах.' }
            ]
        };

        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const col1Text = document.getElementById('col1-text');
        const col2Text = document.getElementById('col2-text');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalFileName = file.name.split('.').slice(0, -1).join('.') + "_ангилсан";

            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                let rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                excelData = rawData.filter(row => row.some(cell => cell !== ""));
                
                if (excelData.length === 0) {
                    alert("Файл хоосон байна!");
                    fileInput.value = "";
                    return;
                }

                resultData = [];
                currentIndex = 0;
                
                switchMainScreen('classify');
                renderCurrentRow();
            };
            reader.readAsArrayBuffer(file);
        });

        function renderCurrentRow() {
            if (currentIndex >= excelData.length) {
                switchMainScreen('result');
                return;
            }

            // Reset state for new row
            currentItemState = { isRelevant: "", mainCategory: "", subCategory: "" };
            showStep('relevance');

            const currentRow = excelData[currentIndex];
            const col1 = currentRow[0] !== undefined ? String(currentRow[0]).trim() : "-";
            const col2 = currentRow[1] !== undefined ? String(currentRow[1]).trim() : "-";

            col1Text.innerText = col1 || "[Хоосон]";
            col2Text.innerText = col2 || "[Хоосон]";

            updateProgress();
        }

        window.handleRelevance = function(isRelevant) {
            if (isRelevant) {
                currentItemState.isRelevant = "Тийм";
                showStep('main');
            } else {
                currentItemState.isRelevant = "Үгүй";
                currentItemState.mainCategory = "-";
                currentItemState.subCategory = "-";
                saveCurrentAndNext();
            }
        }

        window.handleMainCategory = function(category) {
            currentItemState.mainCategory = category;
            
            // Set subcategory title
            document.getElementById('sub-title-display').innerText = category;
            
            // Generate subcategory buttons
            const container = document.getElementById('dynamic-sub-buttons');
            container.innerHTML = ''; 
            
            const subs = subCategoriesData[category] || [];
            
            subs.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-white border border-gray-300 hover:border-blue-500 py-2 px-3 rounded-xl shadow-sm transition-all active:scale-95 flex flex-col gap-1 flex-shrink-0';
                btn.innerHTML = `
                    <div class="font-bold text-gray-800 text-[14px] leading-tight">${sub.title}</div>
                    <div class="text-[12px] text-gray-600 leading-snug">${sub.desc}</div>
                `;
                btn.onclick = () => handleSubCategory(sub.title);
                container.appendChild(btn);
            });

            showStep('sub');
        }

        window.handleSubCategory = function(subCategoryName) {
            currentItemState.subCategory = subCategoryName;
            saveCurrentAndNext();
        }

        window.goBackToStep = function(stepName) {
            showStep(stepName);
        }

        function showStep(stepName) {
            document.getElementById('step-relevance').classList.remove('active');
            document.getElementById('step-main').classList.remove('active');
            document.getElementById('step-sub').classList.remove('active');
            
            document.getElementById('step-' + stepName).classList.add('active');
        }

        function saveCurrentAndNext() {
            const currentRow = excelData[currentIndex];
            let newRow = [...currentRow];
            
            // Ensure array has at least 2 elements from original
            while(newRow.length < 2) {
                newRow.push("");
            }
            
            // Add new classification columns
            newRow[2] = currentItemState.isRelevant;
            newRow[3] = currentItemState.mainCategory;
            newRow[4] = currentItemState.subCategory;
            
            resultData[currentIndex] = newRow;
            
            currentIndex++;
            renderCurrentRow();
        }

        window.undo = function() {
            if (currentIndex > 0) {
                currentIndex--;
                resultData.pop(); 
                renderCurrentRow();
            }
        }

        function updateProgress() {
            const total = excelData.length;
            const percent = ((currentIndex) / total) * 100;
            const text = `${currentIndex + 1} / ${total}`;
            
            progressText.innerText = text;
            progressBar.style.width = `${percent}%`;
        }

        window.downloadExcel = function() {
            const headerRow = ["Багана 1", "Багана 2", "Хамаарал", "Үндсэн ангилал", "Дэд ангилал"];
            const finalDataToExport = [headerRow, ...resultData];

            const worksheet = XLSX.utils.aoa_to_sheet(finalDataToExport);
            worksheet['!cols'] = [
                { wch: 45 }, // Col 1
                { wch: 30 }, // Col 2
                { wch: 15 }, // Rel
                { wch: 25 }, // Main
                { wch: 25 }  // Sub
            ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Ангилсан");
            
            XLSX.writeFile(workbook, `${originalFileName}.xlsx`);
        }

        function switchMainScreen(screenName) {
            document.getElementById('screen-upload').classList.add('hidden');
            document.getElementById('screen-upload').classList.remove('flex');
            
            document.getElementById('screen-classify').classList.add('hidden');
            document.getElementById('screen-classify').classList.remove('flex');
            
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('flex');

            document.getElementById('screen-' + screenName).classList.remove('hidden');
            document.getElementById('screen-' + screenName).classList.add('flex');
        }

        window.resetApp = function() {
            fileInput.value = "";
            excelData = [];
            resultData = [];
            currentIndex = 0;
            switchMainScreen('upload');
        }
    </script>
</body>
</html>
